groups:
  - name: "blackbox-alerts"
    rules:
      - alert: StatusCodeIsDifferentThan200
        expr: probe_http_status_code != 200
        for: "5s"
        labels:
          severity: "critical"
        annotations:
          summary: "The status code is different than 200 for more than 5 seconds"
          description: "Trigger an alert if the status code is different than 200 for more than 5 seconds."